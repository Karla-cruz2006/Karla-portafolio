<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karla Sherlyn · Curriculum Vitae</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml, 
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'> 
<text y='.9em' font-size='90'>🦖</text> </svg>">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#000;
    overflow-x:hidden;
}

/* CONTENEDOR */
.fullscreen-container{
    position:relative;
    min-height:100vh;
}

/* FONDO */
.fullscreen-img{
    width:100%;
    display:block;
    pointer-events:none;
}

/* CAPA */
.scrapbook-layer{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
}

/* ELEMENTOS */
.scrap-item{
    position:absolute;
    cursor:grab;
    transition: outline 0.1s ease;
}

.scrap-item:active{
    cursor:grabbing;
}

.scrap-item img{
    width:100%;
    display:block;
    pointer-events:auto;
}

/* HANDLE DE REDIMENSIÓN */
.resize-handle{
    position:absolute;
    width:16px;
    height:16px;
    background:#ff4d6d;
    border-radius:50%;
    bottom:-8px;
    right:-8px;
    cursor:nwse-resize;
    z-index:999;
    border:2px solid white;
    box-shadow:0 0 4px rgba(0,0,0,0.5);
}

/* HANDLE PARA ROTACIÓN */
.rotate-handle{
    position:absolute;
    width:16px;
    height:16px;
    background:#4d9eff;
    border-radius:50%;
    top:-8px;
    left:-8px;
    cursor:grab;
    z-index:999;
    border:2px solid white;
    box-shadow:0 0 4px rgba(0,0,0,0.5);
}

.rotate-handle:active{
    cursor:grabbing;
}

/* WATERMARK */
.watermark{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:12px;
    font-family:'Segoe UI',system-ui;
    background:rgba(0,0,0,0.5);
    padding:4px 12px;
    border-radius:20px;
    pointer-events:none;
    z-index:20;
}

/* TOOLTIP */
.scrap-item::after {
    content: "🔧";
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 2px 6px;
    border-radius: 10px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    white-space: nowrap;
}

.scrap-item:hover::after {
    opacity: 0.7;
    content: " Doble clic para acción | Arrastra para mover";
}
</style>
</head>

<body>

<div class="fullscreen-container">
    <img src="img/fondo.png" class="fullscreen-img">

    <div class="scrapbook-layer">

        <div class="watermark">
            © 2026 Karla Cruz | YANG´S LAB
        </div>

        <!-- Botón portafolio -->
        <div class="scrap-item" style="top:45%; left:41%; width:22%; transform:rotate(1deg); z-index:100;">
            <img src="img/Boton_portafolio.png">
        </div>

        <!-- Botón curriculum -->
        <div class="scrap-item" style="top:75%; left:7%; width:18%; transform:rotate(-2deg);">
            <img src="img/Boton_curriculum.png">
        </div>

        <!-- Botón contactame -->
        <div class="scrap-item" style="top:75%; left:31%; width:18%; transform:rotate(2deg);">
            <img src="img/Boton_contactame.png">
        </div>

    </div>
</div>

<script>
// ===== FUNCIONES PRINCIPALES =====
function descargarCV() {
    const link = document.createElement('a');
    link.href = "docs/Karla_Cruz_CV.pdf";
    link.download = "Karla_Cruz_CV.pdf";
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    setTimeout(() => document.body.removeChild(link), 100);
}

function irContacto() {
    window.location.href = "contactame.html";
}

function irPortafolio() {
    window.location.href = "portafolio/portafolio.html";
}

// ===== VARIABLES =====
let selected = null;
let isDragging = false;
let isResizing = false;
let isRotating = false;
let startX, startY, startLeft, startTop, startWidth;
let startAngle = 0;
let currentAngle = 0;

// ===== GUARDAR =====
function savePositions(){
    const data = [];
    document.querySelectorAll('.scrap-item').forEach(el => {
        data.push({
            top: el.style.top,
            left: el.style.left,
            width: el.style.width,
            transform: el.style.transform
        });
    });
    localStorage.setItem("layout", JSON.stringify(data));
}

// ===== CARGAR =====
function loadPositions(){
    const data = JSON.parse(localStorage.getItem("layout"));
    if(!data) return;

    document.querySelectorAll('.scrap-item').forEach((el, i) => {
        if(data[i]){
            el.style.top = data[i].top;
            el.style.left = data[i].left;
            el.style.width = data[i].width;
            if(data[i].transform) el.style.transform = data[i].transform;
        }
    });
}

// ===== INTERACCIONES =====
function createHandles(el){
    el.querySelectorAll('.resize-handle, .rotate-handle').forEach(h => h.remove());

    const resizeHandle = document.createElement("div");
    resizeHandle.className = "resize-handle";
    el.appendChild(resizeHandle);

    const rotateHandle = document.createElement("div");
    rotateHandle.className = "rotate-handle";
    el.appendChild(rotateHandle);

    resizeHandle.onmousedown = (e) => {
        e.stopPropagation();
        isResizing = true;
        startX = e.clientX;
        startWidth = el.offsetWidth;
        document.onmousemove = resize;
        document.onmouseup = stop;
    };

    rotateHandle.onmousedown = (e) => {
        e.stopPropagation();
        isRotating = true;

        const rect = el.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        startAngle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * 180 / Math.PI;

        const match = el.style.transform.match(/rotate\(([-\d.]+)deg\)/);
        currentAngle = match ? parseFloat(match[1]) : 0;

        document.onmousemove = rotate;
        document.onmouseup = stop;
    };
}

function rotate(e){
    if(!isRotating || !selected) return;

    const rect = selected.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;

    const newAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
    const diff = newAngle - startAngle;

    selected.style.transform = `rotate(${currentAngle + diff}deg)`;
}

function resize(e){
    if(!isResizing || !selected) return;
    selected.style.width = Math.max(50, startWidth + (e.clientX - startX)) + "px";
}

function startDrag(e, el){
    if(e.target.classList.contains("resize-handle") || e.target.classList.contains("rotate-handle")) return;

    isDragging = true;
    selected = el;

    startX = e.clientX;
    startY = e.clientY;
    startLeft = parseFloat(el.style.left || 0);
    startTop = parseFloat(el.style.top || 0);

    document.onmousemove = drag;
    document.onmouseup = stop;
}

function drag(e){
    if(!isDragging || !selected) return;
    selected.style.left = (startLeft + (e.clientX - startX)) + "px";
    selected.style.top = (startTop + (e.clientY - startY)) + "px";
}

function stop(){
    isDragging = isResizing = isRotating = false;
    document.onmousemove = null;
    document.onmouseup = null;
    savePositions();
}

function selectElement(el){
    if(selected && selected !== el) selected.style.outline = "none";
    selected = el;
    el.style.outline = "2px dashed red";
    createHandles(el);
}

// ===== EVENTOS =====
document.querySelectorAll('.scrap-item').forEach(el => {
    const imgSrc = el.querySelector('img').src.toLowerCase();

    el.onclick = (e)=>{
        e.stopPropagation();
        selectElement(el);
    };

    el.ondblclick = (e)=>{
        e.stopPropagation();
        if(imgSrc.includes('curriculum')) descargarCV();
        else if(imgSrc.includes('contactame')) irContacto();
        else if(imgSrc.includes('portafolio')) irPortafolio();
    };

    el.onmousedown = (e)=> startDrag(e, el);
});

document.body.onclick = () => {
    if(selected){
        selected.style.outline = "none";
        selected = null;
    }
};

window.onload = loadPositions;
</script>

</body>
</html>
