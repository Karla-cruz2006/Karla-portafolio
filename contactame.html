<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto - Karla Sherlyn</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#000;
    font-family:Arial, sans-serif;
}

.fullscreen-container{
    position:relative;
    min-height:100vh;
}

.fullscreen-img{
    width:100%;
    display:block;
}

.scrapbook-layer{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
}

.scrap-item{
    position:absolute;
    cursor:grab;
}

.scrap-item:active{
    cursor:grabbing;
}

.form-cuadro{
    background:rgba(0,0,0,0.85);
    padding:20px;
    border-radius:20px;
    border:1px solid rgba(255,0,0,0.4);
}

.form-label{
    display:block;
    color:#ff3333;
    margin-bottom:6px;
    font-size:0.8rem;
    letter-spacing:2px;
}

.form-input,
.form-textarea{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
}

.botones-container{
    display:flex;
    gap:10px;
}

.btn-enviar,
.btn-limpiar{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:white;
}

.btn-enviar{ background:#ff0000; }
.btn-limpiar{ background:#333; }
</style>
</head>

<body>

<div class="fullscreen-container">
<img src="img/Contactame.png" class="fullscreen-img">

<div class="scrapbook-layer">

<form id="formContacto">

<!-- NOMBRE -->
<div class="scrap-item form-cuadro" style="top:8%; left:8%; width:28%; transform:rotate(2deg);">
<label for="nombre" class="form-label">NOMBRE</label>
<input type="text" id="nombre" name="nombre" class="form-input" required>
</div>

<!-- CORREO -->
<div class="scrap-item form-cuadro" style="top:28%; left:8%; width:28%; transform:rotate(-1deg);">
<label for="correo" class="form-label">CORREO</label>
<input type="email" id="correo" name="correo" class="form-input" required>
</div>

<!-- MENSAJE -->
<div class="scrap-item form-cuadro" style="top:48%; left:8%; width:28%; transform:rotate(1deg);">
<label for="mensaje" class="form-label">MENSAJE</label>
<textarea id="mensaje" name="mensaje" class="form-textarea" required></textarea>
</div>

<!-- BOTONES -->
<div class="scrap-item form-cuadro" style="top:72%; left:8%; width:28%; transform:rotate(-2deg);">
<div class="botones-container">
<button type="submit" id="btnEnviar" class="btn-enviar">✉️ ENVIAR</button>
<button type="button" id="btnLimpiar" class="btn-limpiar">🗑️ LIMPIAR</button>
</div>
</div>

</form>

</div>
</div>

<script>
const FORMSPREE_URL = "https://formspree.io/f/xeevagad";

// ===== FORM =====
function enviarFormulario(){
    const nombre = nombreInput.value.trim();
    const correo = correoInput.value.trim();
    const mensaje = mensajeInput.value.trim();

    fetch(FORMSPREE_URL,{
        method:"POST",
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({nombre,correo,mensaje})
    }).then(()=>alert("Mensaje enviado"));
}

function limpiarFormulario(){
    form.reset();
}

const form = document.getElementById("formContacto");
const nombreInput = document.getElementById("nombre");
const correoInput = document.getElementById("correo");
const mensajeInput = document.getElementById("mensaje");

form.addEventListener("submit",(e)=>{
    e.preventDefault();
    enviarFormulario();
});

document.getElementById("btnLimpiar").onclick = limpiarFormulario;

// ===== DRAG SYSTEM =====
let selected = null;
let isDragging = false;
let startX, startY, startLeft, startTop;

document.querySelectorAll('.scrap-item').forEach(el => {

    el.addEventListener('mousedown', (e) => {

        // ❌ NO mover si estás escribiendo o clickeando botones
        if(
            e.target.tagName === "INPUT" ||
            e.target.tagName === "TEXTAREA" ||
            e.target.tagName === "BUTTON"
        ) return;

        isDragging = true;
        selected = el;

        startX = e.clientX;
        startY = e.clientY;

        startLeft = parseFloat(el.style.left);
        startTop = parseFloat(el.style.top);

        document.onmousemove = drag;
        document.onmouseup = stop;
    });
});

function drag(e){
    if(!isDragging || !selected) return;

    selected.style.left = (startLeft + (e.clientX - startX)) + "px";
    selected.style.top = (startTop + (e.clientY - startY)) + "px";
}

function stop(){
    isDragging = false;
    selected = null;
    document.onmousemove = null;
    document.onmouseup = null;
}
</script>

</body>
</html>
