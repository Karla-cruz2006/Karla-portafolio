<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto - Karla Sherlyn</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml, 
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'> 
<text y='.9em' font-size='90'>🦖</text> </svg>">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#000;
    font-family:Arial, sans-serif;
}

.fullscreen-container{
    position:relative;
    min-height:100vh;
}

.fullscreen-img{
    width:100%;
    display:block;
}

.scrapbook-layer{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
}

/* 🔒 YA NO SE MUEVEN */
.scrap-item{
    position:absolute;
}

/* ESTILO */
.form-cuadro{
    background:rgba(0,0,0,0.85);
    padding:20px;
    border-radius:20px;
    border:1px solid rgba(255,0,0,0.4);
}

.form-label{
    display:block;
    color:#ff3333;
    margin-bottom:6px;
    font-size:0.8rem;
    letter-spacing:2px;
}

.form-input,
.form-textarea{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
}

.botones-container{
    display:flex;
    gap:10px;
}

.btn-enviar,
.btn-limpiar{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:white;
}

.btn-enviar{ background:#ff0000; }
.btn-limpiar{ background:#333; }
</style>
</head>

<body>

<div class="fullscreen-container">
<img src="../img/Contactame.png" class="fullscreen-img">

<div class="scrapbook-layer">

<form id="formContacto">

<!-- COLUMNA IZQUIERDA -->
<div class="scrap-item form-cuadro" style="top:18%; left:20%; width:25%;">
<label for="nombre" class="form-label">NOMBRE</label>
<input type="text" id="nombre" name="nombre" class="form-input" required>
</div>

<div class="scrap-item form-cuadro" style="top:38%; left:20%; width:25%;">
<label for="correo" class="form-label">CORREO</label>
<input type="email" id="correo" name="correo" class="form-input" required>
</div>

<!-- COLUMNA DERECHA -->
<div class="scrap-item form-cuadro" style="top:18%; left:55%; width:25%;">
<label for="mensaje" class="form-label">MENSAJE</label>
<textarea id="mensaje" name="mensaje" class="form-textarea" required></textarea>
</div>

<div class="scrap-item form-cuadro" style="top:48%; left:55%; width:25%;">
<div class="botones-container">
<button type="submit" id="btnEnviar" class="btn-enviar">✉️ ENVIAR</button>
<button type="button" id="btnLimpiar" class="btn-limpiar">🗑️ LIMPIAR</button>
</div>
</div>

</form>

</div>
</div>

<script>
const FORMSPREE_URL = "https://formspree.io/f/xeevagad";

const form = document.getElementById("formContacto");
const nombreInput = document.getElementById("nombre");
const correoInput = document.getElementById("correo");
const mensajeInput = document.getElementById("mensaje");

// ENVIAR
function enviarFormulario(){
    const nombre = nombreInput.value.trim();
    const correo = correoInput.value.trim();
    const mensaje = mensajeInput.value.trim();

    fetch(FORMSPREE_URL,{
        method:"POST",
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({nombre,correo,mensaje})
    }).then(()=>alert("Mensaje enviado"));
}

// LIMPIAR
function limpiarFormulario(){
    form.reset();
}

form.addEventListener("submit",(e)=>{
    e.preventDefault();
    enviarFormulario();
});

document.getElementById("btnLimpiar").onclick = limpiarFormulario;
</script>

</body>
</html>
